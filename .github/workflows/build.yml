name: Build and Package Electron App (Windows & Linux)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create releases and upload assets

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Frontend Assets
        run: npm run build --if-present

      # Always build without publishing — release step handles upload separately
      - name: Package Electron App
        run: npm run package -- --win --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the build — kept 3 days for branch builds, and picked up by the release job on tags
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-build
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 3
          if-no-files-found: error

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Frontend Assets
        run: npm run build --if-present

      # Always build without publishing — release step handles upload separately
      - name: Package Electron App
        run: npm run package -- --linux --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the build — kept 3 days for branch builds, and picked up by the release job on tags
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 3
          if-no-files-found: error

  # On version tag → create one GitHub Release with all installers, after both builds finish.
  # A single job avoids the race where one build publishes the release before the other can upload.
  # Tags with -beta / -alpha / -rc are automatically marked as pre-release
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
